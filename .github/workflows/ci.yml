name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
      - name: Generate report
        if: always()
        run: go run scripts/genreport.go
      - name: Publish report to job summary
        if: always()
        run: cat docs/TEST-REPORT.md >> "$GITHUB_STEP_SUMMARY"

  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      # Full suite under the race detector. The tokenize oracle test takes
      # ~2 min with -race (-short would only shrink it 10x, not skip it), so
      # this runs as its own parallel job to keep the main job fast.
      - name: Test (race detector)
        run: go test -race ./...
